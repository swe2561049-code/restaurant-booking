name: Restaurant Booking CI

on: [push, pull_request]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Кодыг татах
        uses: actions/checkout@v4

      - name: Node.js суулгах
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Тест ажиллуулах
        run: npm test
